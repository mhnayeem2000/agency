<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172033">
    <title>{% block title %}Student Agency{% endblock %}</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --line: #e5e9f0;
            --canvas: #f7f9fc;
            --blue: #2563eb;
            --blue-soft: #eef4ff;
            --red: #c24149;
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background: var(--canvas);
            color: var(--ink);
            display: flex;
            font-family: "Segoe UI", Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        .error-shell {
            max-width: 720px;
            text-align: center;
            width: 100%;
        }

        .brand {
            align-items: center;
            color: var(--ink);
            display: inline-flex;
            font-size: 18px;
            font-weight: 700;
            gap: 10px;
            margin-bottom: 42px;
        }

        .brand-mark {
            align-items: center;
            background: var(--ink);
            border-radius: 9px;
            color: #fff;
            display: inline-flex;
            font-size: 12px;
            height: 32px;
            justify-content: center;
            width: 32px;
        }

        .error-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.09);
            padding: clamp(28px, 7vw, 64px);
        }

        .error-code {
            color: var(--blue);
            font-size: clamp(72px, 16vw, 150px);
            font-weight: 800;
            letter-spacing: -0.08em;
            line-height: 0.9;
            margin: 0 0 22px;
        }

        .error-card h1 {
            font-size: clamp(26px, 5vw, 42px);
            margin: 0 0 12px;
        }

        .error-card p {
            color: var(--muted);
            font-size: 16px;
            margin: 0 auto;
            max-width: 500px;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }

        .button {
            background: var(--blue);
            border-radius: 8px;
            color: #fff;
            display: inline-flex;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 17px;
            text-decoration: none;
        }

        .button-secondary {
            background: var(--blue-soft);
            color: #1d4ed8;
        }

        .error-note {
            color: var(--red);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .error-actions { flex-direction: column; }
            .button { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>
    <main class="error-shell">
        <div class="brand"><span class="brand-mark">SA</span> Student Agency</div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
